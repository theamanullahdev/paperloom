id = "meter/hud-bar"
name = "HUD bar"
author = "Paperloom"
description = "A segmented bar for any meter, with a title, a big value and a detail line."
kinds = ["cpu", "memory", "disk", "network", "battery", "uptime", "weather", "nowplaying"]
fonts = ["fonts/Orbitron[wght].ttf", "fonts/ShareTechMono-Regular.ttf"]
size = [270, 78]

[[element]]
type = "rect"
x = 0
y = 0
w = 270
h = 78
radius = 10
fill = "#050b16cc"
stroke = "#00e5ff33"
stroke_width = 1.5

[[element]]
type = "text"
text = "{title}"
x = 16
y = 9
size = 12
font = "Share Tech Mono"
color = "#00e5ff"

[[element]]
type = "text"
text = "{value}"
x = 254
y = 5
size = 24
bold = true
font = "Orbitron"
color = "#eafcff"
align = "right"

[[element]]
type = "segments"
x = 16
y = 42
w = 238
h = 11
count = 32
gap = 2
value = "fraction"
fill = "grad(#00ff9c,#ffee00,0)"
track = "#ffffff10"
glow = 3.0
show_if = "fraction"

[[element]]
type = "line"
x1 = 16
y1 = 42
x2 = 254
y2 = 42
width = 1
color = "#ffffff22"
show_if = "fraction"

[[element]]
type = "text"
text = "{detail}"
x = 16
y = 58
size = 11
font = "Share Tech Mono"
color = "#9fb4c8"
