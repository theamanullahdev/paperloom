[package]
name = "paperloom-skin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paperloom widget looks: a small declarative format and a software renderer, shared by the widgets process and the app's gallery."

[dependencies]
tiny-skia = "0.11"
cosmic-text = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "1"
# `{%A, %d %B}` in a look: the time in any format (what Rainmeter skins use).
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc"] }
# Rainmeter .rmskin packages are zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }
