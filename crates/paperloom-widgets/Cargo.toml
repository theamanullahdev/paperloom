[package]
name = "paperloom-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paperloom desktop widgets: a small separate process that draws clocks and meters on the desktop."

[dependencies]
paperloom-common = { path = "../paperloom-common" }
# Software drawing: no GPU, no windowing toolkit, so the process stays small.
paperloom-skin = { path = "../paperloom-skin" }
tiny-skia = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The weather feed reads Open-Meteo's answers.
serde_json = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14", features = ["shape", "randr"] }
# Wayland: wlr-layer-shell surfaces on the bottom layer, pixels through shared memory.
# The pure-Rust protocol backend: no libwayland to link, no GPU.
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.21", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# What the system's media session is playing (Now playing).
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: borderless windows at the desktop level, content from an NSBitmapImageRep.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSGeometry", "NSString", "NSRunLoop", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSBitmapImageRep", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSImageView",
    "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow",
] }
