[package]
name = "paperloom-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live video wallpapers — play MP4 loops as your desktop background."
homepage = "https://github.com/theamanullahdev/paperloom"
authors = ["Amanullah Behlim <theamanullahdev@gmail.com>"]

[dependencies]
# "tokio": iced's default executor backend (thread-pool) has no timer
# support at all (`iced::time::every` doesn't exist without it) — needed
# to drive the settings-page highlight animation's frame ticks.
iced = { version = "0.14", features = ["tokio", "svg", "image", "canvas"] }
# Per-process CPU, memory and disk I/O for the Usage page (works on Linux,
# Windows and macOS). No default features: no rayon, only what is read.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rfd = "0.17"
paperloom-common = { path = "../paperloom-common" }
paperloom-skin = { path = "../paperloom-skin" }
tiny-skia = "0.11"
paperloom-fetch = { path = "../paperloom-fetch" }

# cargo-deb reads this to build a .deb package containing both binaries —
# `cargo deb -p paperloom-gui` from the workspace root (see README). Not
# `paperloom-engine`'s Cargo.toml: cargo-deb builds one package per
# invocation, keyed off whichever crate you point it at, so the combined
# package lives here and just pulls the other binary in as an extra asset.
[package.metadata.deb]
name = "paperloom"
maintainer = "Amanullah Behlim <theamanullahdev@gmail.com>"
license-file = ["../../LICENSE"]
# "$auto": cargo-deb inspects the actual compiled binaries via ldd and adds
# whatever shared libraries they really link against (libmpv2, libc, etc.)
# — don't hand-maintain that list, it'll drift from reality.
depends = "$auto"
# Hover previews in the library are extracted with ffmpeg; without it the
# gallery falls back to plain tiles.
recommends = "ffmpeg"
section = "video"
priority = "optional"
extended-description = """\
Paperloom plays looping MP4 videos as your Linux desktop background \
(Wallpaper Engine / Lively Wallpaper, but native to X11/Wayland). GUI-only: \
import videos (or download them from the built-in online library), click "Set as wallpaper", done. Designed to idle at \
near-zero CPU/RAM — the renderer pauses on fullscreen apps, screen lock, \
low battery, or any window covering the desktop (each independently \
configurable)."""
assets = [
    ["target/release/paperloom-gui", "usr/bin/", "755"],
    ["target/release/paperloom-engine", "usr/bin/", "755"],
    ["target/release/paperloom-widgets", "usr/bin/", "755"],
    ["../../packaging/linux/paperloom.desktop", "usr/share/applications/paperloom.desktop", "644"],
    ["../../packaging/icon.png", "usr/share/icons/hicolor/512x512/apps/paperloom.png", "644"],
    ["../../packaging/linux/paperloom-share.xml", "usr/share/mime/packages/paperloom-share.xml", "644"],
]

# cargo-generate-rpm (`cargo generate-rpm -p crates/paperloom-gui`) builds
# the .rpm from the same release binaries. Its automatic dependency scan
# needs rpm's own tooling, which the Ubuntu CI runner lacks, so the one
# real runtime library is named by hand: libmpv.so.2 (Fedora's mpv-libs).
[package.metadata.generate-rpm]
name = "paperloom"
summary = "Live video wallpapers"
license = "GPL-3.0-or-later"
url = "https://github.com/theamanullahdev/paperloom"
auto-req = "disabled"
assets = [
    { source = "target/release/paperloom-gui", dest = "/usr/bin/paperloom-gui", mode = "755" },
    { source = "target/release/paperloom-engine", dest = "/usr/bin/paperloom-engine", mode = "755" },
    { source = "target/release/paperloom-widgets", dest = "/usr/bin/paperloom-widgets", mode = "755" },
    { source = "packaging/linux/paperloom.desktop", dest = "/usr/share/applications/paperloom.desktop", mode = "644" },
    { source = "packaging/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/paperloom.png", mode = "644" },
    { source = "packaging/linux/paperloom-share.xml", dest = "/usr/share/mime/packages/paperloom-share.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/paperloom/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
mpv-libs = "*"

[package.metadata.generate-rpm.recommends]
ffmpeg-free = "*"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
