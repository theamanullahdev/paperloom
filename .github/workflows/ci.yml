name: CI

# Every push (any branch) and every PR: lint + test on Linux, native clippy
# on Windows and macOS. Pull requests and manual runs also build every
# installer (package.yml; downloadable from the run's "Artifacts" box).
# Pushes don't: release.yml builds them for the release. Nothing is
# published here. Every job has a timeout so a stuck runner fails fast.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "site/**", "LICENSE*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install libmpv-dev
        run: scripts/ci-apt.sh libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Native clippy on Windows and macOS: their backends are cfg-gated, so
  # Linux clippy never sees them.
  clippy-other:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy doesn't link, so libmpv isn't needed here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package:
    name: Package
    if: github.event_name != 'push'
    uses: ./.github/workflows/package.yml
