name: Release

# Fully automatic releases. Every push to main that changes more than docs
# becomes a GitHub Release:
#
#   1. plan     — next version from the commits since the last tag
#                 (scripts/next-version.sh: feat → minor, fix/other → patch,
#                 breaking → major, minor while 0.x). Docs-only pushes, or a
#                 commit message containing [skip release], release nothing.
#   2. package  — every installer, with that version stamped in: the Linux
#                 packages (a couple of minutes) and the rest (Windows,
#                 macOS, Flatpak — up to ~15 minutes) as separate groups.
#   3. publish  — as soon as the Linux packages exist: commit
#                 the version bump, tag vX.Y.Z, push, create the Release
#                 with the .deb/.rpm, and refresh the apt repository + the
#                 release list on GitHub Pages. apt users get the update
#                 within minutes instead of waiting for the slowest build.
#   4. attach   — when the other builds finish, add whichever succeeded to
#                 the same Release (checksums and notes updated), and refresh
#                 Pages again. A failed platform is left out and named in the
#                 notes; it ships in the next release once fixed.
#
# Lint and tests are not part of this pipeline: ci.yml runs them on every
# push, in parallel, so a release never waits for (or hangs on) them. Every
# job here has a timeout, so a stuck runner fails fast instead of blocking
# the next release.
#
# Run it by hand from the Actions tab ("Run workflow") to force a
# patch/minor/major release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide the version
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" == *"[skip release]"* ]]; then
            echo "Commit asked for [skip release]."
            exit 0
          fi
          version="$(scripts/next-version.sh "$BUMP")"
          if [ -z "$version" ]; then
            echo "Nothing release-worthy since the last tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists."
            exit 0
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package-linux:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.plan.outputs.version }}
      targets: linux

  package-rest:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.plan.outputs.version }}
      targets: windows,macos,flatpak

  publish:
    needs: [plan, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum paperloom-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Commit the version bump and tag it
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/set-version.sh "$VERSION"
          git add Cargo.toml Cargo.lock packaging/flatpak
          git commit -m "chore(release): v$VERSION [skip release]" || true
          git tag -a "v$VERSION" -m "Paperloom $VERSION"
          git push origin "v$VERSION"
          # Fast-forward main to the bump commit when nothing landed in the
          # meantime; if main moved on, the tag alone is the record (the
          # next release computes its version from tags, not from main).
          git push origin "HEAD:main" || echo "::warning::main moved on during the release; v$VERSION's bump commit is only on the tag."
      - name: Release notes
        run: scripts/release-notes.sh "${{ needs.plan.outputs.version }}" dist early | tee notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: Paperloom ${{ needs.plan.outputs.version }}
          body_path: notes.md
          files: |
            dist/paperloom-*
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

  # apt repository + release list on GitHub Pages, right away for Linux.
  pages-early:
    needs: publish
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit

  attach:
    needs: [plan, publish, package-rest]
    # Runs whether or not every platform built (always()), as long as the
    # release itself exists.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Add the other installers, checksums and final notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git fetch --tags --force
          ls -l dist
          others=$(ls dist/paperloom-* | grep -v -- '-linux-x86_64\.\(deb\|rpm\)$' || true)
          if [ -n "$others" ]; then
            gh release upload "v$VERSION" $others --clobber
          fi
          (cd dist && sha256sum paperloom-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "v$VERSION" dist/SHA256SUMS.txt --clobber
          scripts/release-notes.sh "$VERSION" dist final | tee notes.md
          gh release edit "v$VERSION" --notes-file notes.md

  # Pages again, so the release list (read by the in-app updater on Windows
  # and macOS) includes the installers attached above.
  pages-final:
    needs: attach
    if: always() && needs.attach.result == 'success'
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
