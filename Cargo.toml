[workspace]
resolver = "2"
members = [
    "crates/paperloom-common",
    "crates/paperloom-gui",
    "crates/paperloom-engine",
    "crates/paperloom-widgets",
    "crates/paperloom-skin",
    "crates/paperloom-fetch",
]

[workspace.package]
version = "0.27.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Smaller binaries and a bit less memory at runtime. Unwinding stays on so a
# panic in a worker thread is contained instead of closing the app.
[profile.release]
lto = "thin"
strip = "symbols"
